name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm test:types

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:coverage
      - run: corepack pnpm build
      - run: corepack pnpm api:check
      - run: corepack pnpm budget:check
      - run: node scripts/check-api-policy.mjs
      - run: corepack pnpm test:consumers
      - run: corepack pnpm check:standalone
      - run: corepack pnpm check:packages
      - run: corepack pnpm audit --prod --audit-level high
      - run: corepack pnpm sbom:generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: artifacts/sbom.cdx.json

  browsers:
    strategy:
      fail-fast: false
      matrix:
        playwright: ["1.61.1", "1.60.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - if: matrix.playwright != '1.61.1'
        run: corepack pnpm add -Dw --lockfile=false @playwright/test@${{ matrix.playwright }}
      - run: corepack pnpm exec playwright install --with-deps chromium firefox webkit
      - run: corepack pnpm build
      - run: corepack pnpm exec playwright test --project=chromium --project=firefox --project=webkit --project=mobile-chromium
